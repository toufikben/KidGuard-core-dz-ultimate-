name: Lab verification

on:
  push:
    branches: ["lab/**"]
    paths: ["lab/**", ".github/workflows/lab-ci.yml", "package.json"]
  pull_request:
    paths: ["lab/**"]

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check lab shell scripts
        run: |
          find lab -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Install shellcheck if absent
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi

      - name: Shellcheck lab scripts
        run: |
          files=$(find lab -name '*.sh')
          if [ -n "$files" ]; then shellcheck -S warning $files; fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # Reviewer C (final review) measured that a *.test.mjs file containing no test() still makes
      # Node print `tests 1 / pass 1 / fail 0` and exit 0, so the old filename guard AND a `>= 1`
      # count both go green on one stub file (I reproduced that in a throwaway probe dir: one empty
      # test file reported `tests 1`, gate exit 0). The gate is therefore a floor on the reported
      # count, set from the measured suite size on 2026-10-08 (`npm run test:lab` -> tests 97).
      # Dropping below it is a deliberate act: raise the floor in the same commit, or the run goes red.
      # pipefail is what stops `tee` from swallowing a failing suite behind a 0 exit.
      - name: Run lab tests and enforce the measured test-count floor
        env:
          EXPECTED_MIN_TESTS: "97"
        run: |
          set -o pipefail
          npm run test:lab 2>&1 | tee lab-tests.log
          awk -v min="$EXPECTED_MIN_TESTS" '$2 == "tests" { n = $3 + 0 }
            END { if (n < min) { printf "only %d tests reported, floor is %s\n", n, min; exit 1 } }' lab-tests.log
        shell: bash

      - name: Validate lab config template
        run: npm run lab:check
